<style>.mono{font-family:Consolas,monospace}.name{font: bold 64px Arial,sans-serif;letter-spacing:-3px;fill:#f6f3ea}.sweep{transform-origin:783px 162px;animation:turn 8s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.sweep{animation:none}}</style>
