<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">Mohammed Jawwad Nagarmat — Signal Lab</title><desc id="desc">An animated signal scope sweeps past three project markers named CampusPilot, BlackOut and CaseVault.</desc>
