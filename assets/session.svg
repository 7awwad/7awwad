<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 203" role="img"><title>BlackOut round two — illustrated session replay</title><style>text{font-family:ui-monospace,Consolas,monospace}.row1{animation:a 9s infinite}.row2{animation:b 9s infinite}.row3{animation:c 9s infinite}@keyframes a{0%{opacity:.15}12%,95%{opacity:1}}@keyframes b{0%,23%{opacity:.15}40%,95%{opacity:1}}@keyframes c{0%,49%{opacity:.15}66%,95%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="960" height="203" fill="#15162d"/><rect x="0" width="5" height="203" fill="#9cdcff"/><path d="M25 52H933" stroke="#454767"/><g font-size="17" fill="#b8b2ff"><text x="28" y="34">7awwad@lab ~/blackout</text><text x="932" y="34" text-anchor="end">ROUND 02 / REPLAY</text></g><g font-size="20" fill="#eff5ff"><text class="row1" x="28" y="92">[ duel ]     Win the match to enter the hunt.</text><text class="row2" x="28" y="131">[ scan ]     Collect the number in three parts: 3 + 3 + 4.</text><text class="row3" x="28" y="170">[ call ]     Dial the coordinator to finish.</text></g></svg>
